pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'lightspeed-neoforge-1.21.1'
include 'agent'

project(':agent').projectDir = file('../../agent')
def identity = new Properties()
file('../../gradle.properties').withReader('UTF-8') { identity.load(it) }
def selection = file('../../.temple/active-target')
def activeTarget = selection.isFile() ? selection.getText('UTF-8').trim() : identity.getProperty('temple_default_target')
def active = activeTarget == rootDir.name
include ':common'
def commonContext = active ? file('../../common') : file("../../common/.gradle/contexts/${rootDir.name}")
commonContext.mkdirs()
project(':common').projectDir = commonContext
project(':common').buildFileName = active ? 'build.gradle' : '../../../build.gradle'

include ':agent'
def agentContext = active ? file('../../agent') : file("../../agent/.gradle/contexts/${rootDir.name}")
agentContext.mkdirs()
project(':agent').projectDir = agentContext
project(':agent').buildFileName = active ? 'build.gradle' : '../../../build.gradle'
