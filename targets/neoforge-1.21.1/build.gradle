plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

ext.neo_version = loader_version
apply from: file('../../gradle/target-conventions/base.gradle')

group = mod_group_id
version = mod_version

evaluationDependsOn(':agent')
def embeddedAgentTask = project(':agent').tasks.named('shadowJar')

base {
    archivesName = mod_id
}

def bootstrapAgentEnabled = providers.gradleProperty('lightspeed.bootstrapAgent')
        .map { value -> value.toBoolean() }
        .getOrElse(false)
def bootstrapAgentPath = embeddedAgentTask.get().archiveFile.get().asFile.absolutePath

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenLocal()
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

neoForge {
    version = project.neo_version
    accessTransformers.from file('../../common/src/compat/neoforge/1.21.1/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            if (bootstrapAgentEnabled) {
                jvmArgument "-javaagent:${bootstrapAgentPath}"
                systemProperty 'lightspeed.agent.allowUnowned', 'true'
            }
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    *project.ext.templeDatagenExistingArgs
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

if (providers.gradleProperty('lightspeed.distributionRun').orNull == 'true') {
    def distributionRuntime = sourceSets.create('distributionRuntime')
    neoForge.addModdingDependenciesTo(distributionRuntime)
    neoForge.runs.create('distributionClient') {
        client()
        sourceSet = distributionRuntime
        loadedMods.set([])
        gameDirectory = file(providers.gradleProperty('lightspeed.runDirectory').get())
        jvmArguments.addAll('-Xms512m', '-Xmx4G', "-Djava.io.tmpdir=${System.getProperty('java.io.tmpdir')}")
        programArguments.addAll('--username', 'StartupCheck')
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    def json = new groovy.json.JsonGenerator.Options().disableUnicodeEscaping().build()
    def escaped = replaceProperties.collectEntries { key, value ->
        def encoded = json.toJson(value.toString()).replace('\u007f', '\\u007f')
        [(key): encoded.substring(1, encoded.length() - 1)]
    }
    filter { line -> line.replaceAll(/\$\{([a-z_]+)\}/) { match, key -> escaped.containsKey(key) ? escaped[key] : match } }
    from "../../common/src/compat/neoforge/1.21.1/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

dependencies {
    compileOnly files(project(':agent').layout.buildDirectory.dir('classes/java/main'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava').configure {
    dependsOn ':agent:compileJava'
}

tasks.named('build').configure {
    dependsOn ':agent:shadowJar'
}

if (bootstrapAgentEnabled) {
    tasks.matching { task -> task.name.startsWith('run') }.configureEach {
        dependsOn ':agent:shadowJar'
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes('Automatic-Module-Name': 'com.ccr4ft3r.lightspeed.early')
    dependsOn project(':agent').tasks.named('generateEarlyServiceModule')
    from(project(':agent').layout.buildDirectory.dir('generated/early-service'))
    dependsOn embeddedAgentTask
    from('../../LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-Lightspeed.txt' }
    }
    from(embeddedAgentTask.flatMap { it.archiveFile }) {
        into 'META-INF/lightspeed'
        rename { 'bootstrap-agent.jar' }
    }
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def verificationReleaseFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
def verificationAgentFile = embeddedAgentTask.get().archiveFile.get().asFile

tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Verifies the NeoForge Mod JAR and its embedded bootstrap Agent.'
    notCompatibleWithConfigurationCache('Reads the built Mod and Agent task outputs directly.')
    dependsOn tasks.named('jar'), embeddedAgentTask
    doLast {
        File release = verificationReleaseFile
        new java.util.zip.ZipFile(release).withCloseable { zip ->
            ['META-INF/neoforge.mods.toml', 'META-INF/LICENSE-Lightspeed.txt', 'lightspeed.mixins.json',
             'META-INF/lightspeed/bootstrap-agent.jar', 'module-info.class',
             'META-INF/services/cpw.mods.modlauncher.api.ITransformationService',
             'META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator'].each { name ->
                if (zip.getEntry(name) == null) {
                    throw new GradleException("release JAR is missing ${name}")
                }
            }
            def manifest = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (manifest.mainAttributes.getValue('Premain-Class') != null) {
                throw new GradleException('top-level Mod JAR must not declare Premain-Class')
            }
            byte[] embedded = zip.getInputStream(zip.getEntry('META-INF/lightspeed/bootstrap-agent.jar')).readAllBytes()
            new java.util.jar.JarInputStream(new ByteArrayInputStream(embedded)).withCloseable { payload ->
                def attributes = payload.manifest?.mainAttributes
                if (attributes == null
                        || attributes.getValue('Launcher-Agent-Class') != 'com.ccr4ft3r.lightspeed.bootstrap.entrypoint.LoaderAgent'
                        || attributes.getValue('Boot-Class-Path') != 'lightspeed-bootstrap-agent.jar'
                        || attributes.getValue('Can-Retransform-Classes') != 'true') {
                    throw new GradleException('embedded bootstrap launch entry is incomplete')
                }
            }
            byte[] builtAgent = verificationAgentFile.bytes
            if (!java.security.MessageDigest.isEqual(
                    java.security.MessageDigest.getInstance('SHA-256').digest(embedded),
                    java.security.MessageDigest.getInstance('SHA-256').digest(builtAgent))) {
                throw new GradleException('embedded Agent differs from its build artifact')
            }
        }
        println 'SINGLE_JAR_DISTRIBUTION_OK'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

apply from: file('../../gradle/target-conventions/publish.gradle')
