plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

evaluationDependsOn(':agent')
def embeddedAgentTask = project(':agent').tasks.named('shadowJar')

base {
    archivesName = mod_id
}

def bootstrapAgentEnabled = providers.gradleProperty('lightspeed.bootstrapAgent')
        .map { value -> value.toBoolean() }
        .getOrElse(false)
def bootstrapAgentPath = project(':agent').layout.buildDirectory
        .file("libs/lightspeed-bootstrap-agent-${project.version}.jar")
        .get().asFile.absolutePath

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenLocal()
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            if (bootstrapAgentEnabled) {
                jvmArgument "-javaagent:${bootstrapAgentPath}"
            }
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

dependencies {
    compileOnly files(project(':agent').layout.buildDirectory.dir('classes/java/main'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava').configure {
    dependsOn ':agent:compileJava'
}

tasks.named('build').configure {
    dependsOn ':agent:build'
}

if (bootstrapAgentEnabled) {
    tasks.matching { task -> task.name.startsWith('run') }.configureEach {
        dependsOn ':agent:shadowJar'
    }
}

tasks.named('jar', Jar).configure {
    dependsOn embeddedAgentTask
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-Lightspeed.txt' }
    }
    from(embeddedAgentTask.flatMap { it.archiveFile }) {
        into 'META-INF/lightspeed'
        rename { 'bootstrap-agent.jar' }
    }
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Verifies the NeoForge Mod JAR and its embedded bootstrap Agent.'
    notCompatibleWithConfigurationCache('Reads the built Mod and Agent task outputs directly.')
    dependsOn tasks.named('jar'), embeddedAgentTask
    doLast {
        File release = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(release).withCloseable { zip ->
            ['META-INF/neoforge.mods.toml', 'META-INF/LICENSE-Lightspeed.txt', 'lightspeed.mixins.json',
             'META-INF/lightspeed/bootstrap-agent.jar'].each { name ->
                if (zip.getEntry(name) == null) {
                    throw new GradleException("release JAR is missing ${name}")
                }
            }
            def manifest = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (manifest.mainAttributes.getValue('Premain-Class') != null) {
                throw new GradleException('top-level Mod JAR must not declare Premain-Class')
            }
            byte[] embedded = zip.getInputStream(zip.getEntry('META-INF/lightspeed/bootstrap-agent.jar')).readAllBytes()
            byte[] builtAgent = embeddedAgentTask.get().archiveFile.get().asFile.bytes
            if (!java.security.MessageDigest.isEqual(
                    java.security.MessageDigest.getInstance('SHA-256').digest(embedded),
                    java.security.MessageDigest.getInstance('SHA-256').digest(builtAgent))) {
                throw new GradleException('embedded Agent differs from its build artifact')
            }
        }
        println 'SINGLE_JAR_DISTRIBUTION_OK'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
