buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }

    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

evaluationDependsOn(':agent')
def embeddedAgentTask = project(':agent').tasks.named('shadowJar')
def embeddedAgentEnabled = providers.gradleProperty('lightspeed.embeddedAgent')
        .map { value -> value.toBoolean() }
        .getOrElse(false)
def embeddedAgentPath = embeddedAgentTask.get().archiveFile.get().asFile.absolutePath

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

base {
    archivesName = mod_id
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://github.com/ParchmentMC/Parchment/wiki/Getting-Started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            if (embeddedAgentEnabled) {
                jvmArgs "-javaagent:${embeddedAgentPath}"
                property 'lightspeed.agent.allowUnowned', 'true'
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    mavenCentral() // MixinExtras is published to Maven Central

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    // flatDir {
    //     dir 'libs'
    // }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use. If this is any group other than 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency, and its patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files(project(':agent').layout.buildDirectory.dir('classes/java/main'))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras (@WrapOperation/@Local) - official Forge 1.18.2+ ForgeGradle setup.
    compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.3.5')
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.3.5')) {
        jarJar.ranged(it, '[0.3.5,)')
    }

    // Real mod deobf dependency examples - these get remapped to your current mappings
    // compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}:api") // Adds JEI API as a compile dependency
    // runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}") // Adds the full JEI mod as a runtime dependency
    // implementation fg.deobf("com.tterrag.registrate:Registrate:MC${minecraft_version}-${registrate_version}") // Adds registrate as a dependency

    // Examples using mod jars from ./libs
    // implementation fg.deobf("blank:coolmod-${minecraft_version}:${coolmod_version}")

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    dependsOn embeddedAgentTask
    from(embeddedAgentTask.flatMap { it.archiveFile }) {
        into 'META-INF/lightspeed'
        rename { 'bootstrap-agent.jar' }
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-Lightspeed.txt' }
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    destinationDirectory = layout.buildDirectory.dir('intermediates')
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('verifyResourcePathIndex', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free resource prefix index regression checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.cache.resource.ResourcePathIndexCheck'
}

tasks.register('verifyResourcePathValidationCache', JavaExec) {
    group = 'verification'
    description = 'Verifies repeated PathPack directory validation is memoized without changing errors.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.cache.resource.ResourcePathValidationCacheCheck'
}

tasks.register('verifyNeutralCacheCodec', JavaExec) {
    group = 'verification'
    description = 'Verifies deterministic bounded neutral resource-cache persistence and fail-open.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.cache.persistence.NeutralCacheCodecCheck'
}

tasks.register('verifySnapshotFaultIsolation', JavaExec) {
    group = 'verification'
    description = 'Verifies corruption in one persisted asset snapshot cannot invalidate another domain.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.cache.assets.SnapshotFaultIsolationCheck'
}

tasks.register('verifyPixelSnapshotCodec', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free native pixel snapshot codec regression checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.client.cache.assets.PixelSnapshotCodecCheck'
}

tasks.register('verifyShaderProgramIdentity', JavaExec) {
    group = 'verification'
    description = 'Verifies shader binary keys cover processed source, attributes, vertex format, and driver identity.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.client.cache.assets.ShaderProgramIdentityCheck'
}

tasks.register('verifyLaunchProfileInstaller', JavaExec) {
    group = 'verification'
    description = 'Runs PCL and version-JSON bootstrap installation regression checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.startup.installation.LaunchProfileInstallerCheck'
}

tasks.register('verifyPackCompilerCommand', JavaExec) {
    group = 'verification'
    description = 'Verifies pre-launch compiler scripts preserve paths and always fail open.'
    dependsOn tasks.named('testClasses'), embeddedAgentTask
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.startup.installation.PackCompilerCommandCheck'
    systemProperty 'lightspeed.agent.jar', embeddedAgentTask.get().archiveFile.get().asFile
}

tasks.register('verifyStartupAdvice', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free Java and bootstrap Agent recommendation checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.client.advice.StartupAdviceCheck'
}

tasks.register('verifyStartupMetrics', JavaExec) {
    group = 'verification'
    description = 'Verifies process-relative startup milestones are unique and JFR-ready.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.startup.metrics.StartupMetricsCheck'
}

tasks.register('verifyStartupTaskPlan', JavaExec) {
    group = 'verification'
    description = 'Verifies startup task validation, dependency planning, executor routing, and failure isolation.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.api.startup.StartupTaskPlanCheck'
}

tasks.register('verifyLauncherRefresh', JavaExec) {
    group = 'verification'
    description = 'Verifies supported launcher processes are refreshed without touching unknown parents.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.startup.installation.LauncherRefreshCoordinatorCheck'
}

tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Verifies the single release JAR and its embedded bootstrap payload.'
    dependsOn tasks.named('reobfJarJar'), embeddedAgentTask
    doLast {
        File mixinMappings = layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg').get().asFile
        if (!mixinMappings.isFile() || !tasks.named('reobfJarJar').get().extraMappings.files.any {
            it.canonicalFile == mixinMappings.canonicalFile
        }) {
            throw new GradleException('JarJar reobf did not receive generated Mixin shadow mappings')
        }
        File release = tasks.named('jarJar').get().archiveFile.get().asFile
        List<File> published = fileTree(layout.buildDirectory.dir('libs')) {
            include '*.jar'
        }.files.sort()
        if (published != [release]) {
            throw new GradleException("build/libs must contain only ${release.name}, found ${published*.name}")
        }

        byte[] embedded
        new java.util.zip.ZipFile(release).withCloseable { zip ->
            ['META-INF/mods.toml', 'META-INF/LICENSE-Lightspeed.txt', 'lightspeed.mixins.json', 'lightspeed.refmap.json',
             'META-INF/lightspeed/bootstrap-agent.jar'].each { name ->
                if (zip.getEntry(name) == null) {
                    throw new GradleException("release JAR is missing ${name}")
                }
            }
            def manifest = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (manifest.mainAttributes.getValue('Premain-Class') != null) {
                throw new GradleException('top-level Mod JAR must not declare Premain-Class')
            }
            embedded = zip.getInputStream(zip.getEntry('META-INF/lightspeed/bootstrap-agent.jar')).readAllBytes()
        }

        byte[] builtAgent = embeddedAgentTask.get().archiveFile.get().asFile.bytes
        if (!java.security.MessageDigest.isEqual(
                java.security.MessageDigest.getInstance('SHA-256').digest(embedded),
                java.security.MessageDigest.getInstance('SHA-256').digest(builtAgent))) {
            throw new GradleException('embedded Agent differs from the verified Agent build')
        }

        boolean licenseFound = false
        new java.util.jar.JarInputStream(new ByteArrayInputStream(embedded)).withCloseable { input ->
            def manifest = input.manifest
            if (manifest == null
                    || manifest.mainAttributes.getValue('Premain-Class') != 'com.ccr4ft3r.lightspeed.bootstrap.LightspeedAgent'
                    || manifest.mainAttributes.getValue('Implementation-Version') != project.version.toString()) {
                throw new GradleException('embedded Agent manifest is incomplete or version-mismatched')
            }
            for (def entry = input.nextJarEntry; entry != null; entry = input.nextJarEntry) {
                if (entry.name == 'META-INF/licenses/ASM.txt') {
                    licenseFound = true
                }
            }
        }
        if (!licenseFound) {
            throw new GradleException('embedded Agent is missing the ASM redistribution license')
        }
        println 'SINGLE_JAR_DISTRIBUTION_OK'
    }
}

tasks.named('compileJava').configure {
    dependsOn ':agent:compileJava'
    options.incremental = false
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'))
}

// MixinGradle contributes its generated shadow mappings at execution time.
// The JarJar reobf task must see them after the annotation processor has run.
tasks.matching { it.name == 'configureReobfTaskForReobfJarJar' }.configureEach {
    dependsOn tasks.named('compileJava')
}

if (embeddedAgentEnabled) {
    tasks.matching { task -> task.name.startsWith('run') }.configureEach {
        dependsOn embeddedAgentTask
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyResourcePathIndex'), tasks.named('verifyResourcePathValidationCache'),
            tasks.named('verifyNeutralCacheCodec'),
            tasks.named('verifySnapshotFaultIsolation'),
            tasks.named('verifyPixelSnapshotCodec'),
            tasks.named('verifyShaderProgramIdentity'),
            tasks.named('verifyLaunchProfileInstaller'), tasks.named('verifyPackCompilerCommand'),
            tasks.named('verifyStartupAdvice'), tasks.named('verifyStartupMetrics'), tasks.named('verifyStartupTaskPlan'),
            tasks.named('verifyLauncherRefresh'),
            tasks.named('verifyDistribution'), ':agent:check'
}
