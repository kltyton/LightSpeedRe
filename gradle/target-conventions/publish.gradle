import groovy.json.JsonSlurper
import com.electronwill.nightconfig.core.UnmodifiableConfig
import com.electronwill.nightconfig.toml.TomlParser
import java.util.jar.Manifest
import java.util.zip.ZipFile

buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'com.electronwill.night-config:toml:3.8.3' }
}

apply plugin: 'maven-publish'

def archiveTask = loader == 'forge' && tasks.findByName('jarJar') != null ? 'jarJar' :
        tasks.findByName('remapJar') instanceof AbstractArchiveTask ? 'remapJar' :
        (tasks.findByName('reobfJar') instanceof AbstractArchiveTask ? 'reobfJar' : 'jar')
def productionTask = tasks.named(archiveTask, AbstractArchiveTask)
def productionFile = productionTask.flatMap { it.archiveFile }
def releaseTask = loader == 'forge' ? 'reobfJarJar' : productionTask
def artifactRecord = layout.buildDirectory.file('temple/artifact.properties')
def verifyDistribution = tasks.named('verifyDistribution') {
    group = 'verification'
    dependsOn productionTask, releaseTask
    inputs.file(productionFile)
    def javaPackage = findProperty('mod_java_package') ?: mod_group_id
    def entryClass = findProperty('mod_entry_class') ?: "${javaPackage}.TempleCommon"
    inputs.properties([mod_id: mod_id, mod_java_package: javaPackage, mod_entry_class: entryClass,
                       loader: loader, minecraft_version: minecraft_version, mod_version: mod_version,
                       minecraft_version_range: minecraft_version_range])
    outputs.file(artifactRecord)
    doLast {
        def artifact = productionFile.get().asFile
        def metadata = loader == 'fabric' ? 'fabric.mod.json' :
                (loader == 'forge' ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml')
        def required = [metadata, javaPackage.replace('.', '/') + '/BuildInfo.class',
                        entryClass.replace('.', '/') + '.class']
        new ZipFile(artifact).withCloseable { zip ->
            required.each { name ->
                if (zip.getEntry(name) == null) {
                    throw new GradleException("Missing ${name} in ${artifact}")
                }
            }
            def text = zip.getInputStream(zip.getEntry(metadata)).getText('UTF-8')
            if (loader == 'fabric') {
                def value = new JsonSlurper().parseText(text)
                if (value.id != mod_id.toString() || value.version != mod_version.toString() ||
                        !(value.depends.minecraft in [minecraft_version.toString(), '=' + minecraft_version, minecraft_version_range.toString()]))
                    throw new GradleException("Incorrect Fabric metadata in ${artifact}")
            } else {
                def value = new TomlParser().parse(text)
                List<UnmodifiableConfig> mods = value.get('mods')
                def mod = mods?.find { it.get('modId') == mod_id.toString() }
                if (mod == null) throw new GradleException("Incorrect mod identity in ${artifact}")
                String version = mod.get('version')
                Map substitutions = [:]
                UnmodifiableConfig properties = value.get('properties')
                if (properties != null) substitutions.putAll(properties.valueMap())
                def manifest = zip.getEntry('META-INF/MANIFEST.MF')
                if (manifest != null) zip.getInputStream(manifest).withCloseable {
                    substitutions.jarVersion = new Manifest(it).mainAttributes.getValue('Implementation-Version')
                }
                version = version.replaceAll(/\$\{file\.([^}]+)\}/) { match, key ->
                    if (substitutions[key] == null) throw new GradleException("Unresolved version property: ${match}")
                    substitutions[key].toString()
                }
                if (version != mod_version.toString()) throw new GradleException("Incorrect mod version in ${artifact}")
                List<UnmodifiableConfig> dependencies = value.get(['dependencies', mod_id.toString()])
                def minecraft = dependencies?.find { it.get('modId') == 'minecraft' }
                if (minecraft == null || minecraft.get('versionRange') != minecraft_version_range.toString())
                    throw new GradleException("Incorrect Minecraft range in ${artifact}")
                if (loader == 'forge') {
                    def packEntry = zip.getEntry('pack.mcmeta')
                    if (packEntry == null) throw new GradleException("Missing pack.mcmeta in ${artifact}")
                    def pack = zip.getInputStream(packEntry).withCloseable { new JsonSlurper().parse(it, 'UTF-8') }.pack
                    if (!(pack instanceof Map) || pack.description == null ||
                            !(pack.pack_format instanceof Number || pack.min_format != null && pack.max_format != null))
                        throw new GradleException("Invalid pack.mcmeta in ${artifact}")
                }
            }
        }
        def record = artifactRecord.get().asFile
        record.parentFile.mkdirs()
        record.setText("artifact=${artifact.absolutePath.replace('\\', '/')}\n", 'UTF-8')
    }
}
tasks.named('build') { dependsOn verifyDistribution }
tasks.configureEach {
    if (name.startsWith('publish')) { dependsOn verifyDistribution }
}

def platform = providers.gradleProperty('publish_platform').getOrElse('none')
if (!(platform in ['none', 'modrinth', 'curseforge', 'both', 'maven'])) {
    throw new GradleException("Unknown publish_platform: ${platform}")
}
publishMods {
    file = productionFile
    changelog = providers.environmentVariable('PUBLISH_CHANGELOG').getOrElse('See the project changelog.')
    type = STABLE
    modLoaders.add(loader)
    if (platform in ['curseforge', 'both']) {
        curseforge {
            projectId = providers.environmentVariable('CURSEFORGE_PROJECT_ID')
                    .orElse(providers.provider { findProperty('publish_curseforge_project_id')?.toString() })
            accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
            minecraftVersions.add(minecraft_version)
            client = true
            server = false
        }
    }
    if (platform in ['modrinth', 'both']) {
        modrinth {
            projectId = providers.environmentVariable('MODRINTH_PROJECT_ID')
                    .orElse(providers.provider { findProperty('publish_modrinth_project_id')?.toString() })
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            minecraftVersions.add(minecraft_version)
        }
    }
}
tasks.named('publishMods') {
    dependsOn verifyDistribution
    doFirst {
        if (platform in ['none', 'maven']) {
            throw new GradleException('Select -Ppublish_platform=modrinth, curseforge or both before uploading.')
        }
    }
}
publishing {
    publications {
        mod(MavenPublication) {
            artifact(productionFile) { builtBy verifyDistribution }
            artifact(tasks.named('sourcesJar'))
            groupId = project.group.toString()
            artifactId = base.archivesName.get()
            version = project.version.toString()
        }
    }
    repositories {
        def address = providers.environmentVariable('TEMPLE_MAVEN_URL')
        if (address.present) {
            maven {
                name = 'remote'
                url = uri(address.get())
                credentials {
                    username = providers.environmentVariable('MAVEN_USERNAME').orNull
                    password = providers.environmentVariable('MAVEN_PASSWORD').orNull
                }
            }
        }
    }
}
tasks.named('publish') {
    dependsOn verifyDistribution
    doFirst {
        if (!providers.environmentVariable('TEMPLE_MAVEN_URL').present) {
            throw new GradleException('Set TEMPLE_MAVEN_URL before Maven publishing.')
        }
    }
}
tasks.withType(GenerateModuleMetadata).configureEach { enabled = false }
