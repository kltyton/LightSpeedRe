apply from: file('../../gradle/target-conventions/base.gradle')
base.archivesName = "${mod_id}-${loader}"

neoForge {
    version = loader_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            if ((java_version as int) >= 25) { clientData() } else { data() }
            programArguments.addAll('--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    *project.ext.templeDatagenExistingArgs)
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}
if (providers.gradleProperty('lightspeed.distributionRun').orNull == 'true') {
    def distributionRuntime = sourceSets.create('distributionRuntime')
    neoForge.addModdingDependenciesTo(distributionRuntime)
    neoForge.runs.create('distributionClient') {
        client()
        sourceSet = distributionRuntime
        loadedMods.set([])
        gameDirectory = file(providers.gradleProperty('lightspeed.runDirectory').get())
        jvmArguments.addAll('-Xms512m', '-Xmx4G', "-Djava.io.tmpdir=${System.getProperty('java.io.tmpdir')}")
        programArguments.addAll('--username', 'StartupCheck')
    }
}
tasks.register('verifyDistribution')
apply from: file('../../gradle/target-conventions/publish.gradle')
