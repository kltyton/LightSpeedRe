plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.10'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

configurations {
    forgeProductionTarget { transitive = false }
    forgeDevelopmentTarget { transitive = false }
    neoForgeTarget { transitive = false }
    secureJar2Target { transitive = false }
    secureJar3Target { transitive = false }
    eventBusTarget { transitive = false }
    eventBusOldTarget { transitive = false }
    eventBusMidTarget { transitive = false }
    eventBusCurrentTarget { transitive = false }
    modLauncher10Target { transitive = false }
    modLauncher11Target { transitive = false }
    modLauncher11LegacyTarget { transitive = false }
    forgeSpiTarget { transitive = false }
}

dependencies {
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'org.ow2.asm:asm-util:9.7.1'
    testImplementation files(configurations.forgeProductionTarget)
    testImplementation files(configurations.forgeSpiTarget)

    forgeProductionTarget 'net.minecraftforge:fmlloader:1.20.1-47.4.0'
    forgeDevelopmentTarget 'net.minecraftforge:fmlloader:1.20.1-47.4.20'
    neoForgeTarget 'net.neoforged.fancymodloader:loader:4.0.42'
    secureJar2Target 'cpw.mods:securejarhandler:2.1.10'
    secureJar3Target 'cpw.mods:securejarhandler:3.0.8'
    eventBusTarget 'net.minecraftforge:eventbus:6.0.5'
    eventBusOldTarget 'net.minecraftforge:eventbus:6.0.3'
    eventBusMidTarget 'net.minecraftforge:eventbus:6.2.8'
    eventBusCurrentTarget 'net.minecraftforge:eventbus:6.2.33'
    modLauncher10Target 'cpw.mods:modlauncher:10.0.9'
    modLauncher11Target 'cpw.mods:modlauncher:11.0.5'
    modLauncher11LegacyTarget 'cpw.mods:modlauncher:11.0.4'
    forgeSpiTarget 'net.minecraftforge:forgespi:7.0.1'
}

tasks.named('jar', Jar).configure {
    enabled = false
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    archiveBaseName = 'lightspeed-bootstrap-agent'
    archiveClassifier = ''
    archiveVersion = ''
    destinationDirectory = rootProject.layout.buildDirectory.dir('embedded-agent')
    relocate 'org.objectweb.asm', 'com.ccr4ft3r.lightspeed.bootstrap.internal.asm'
    manifest {
        attributes(
                'Premain-Class': 'com.ccr4ft3r.lightspeed.bootstrap.LightspeedAgent',
                'Can-Redefine-Classes': 'false',
                'Can-Retransform-Classes': 'false',
                'Implementation-Title': 'Lightspeed Bootstrap Agent',
                'Implementation-Version': project.version
        )
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('assemble').configure {
    dependsOn tasks.named('shadowJar')
}

tasks.register('verifyAgent', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free bootstrap agent regression checks.'
    dependsOn tasks.named('testClasses'), tasks.named('shadowJar')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.bootstrap.AgentRegressionCheck'
    systemProperty 'lightspeed.target.forge.production', configurations.forgeProductionTarget.singleFile
    systemProperty 'lightspeed.target.forge.development', configurations.forgeDevelopmentTarget.singleFile
    systemProperty 'lightspeed.target.neoforge', configurations.neoForgeTarget.singleFile
    systemProperty 'lightspeed.target.securejar2', configurations.secureJar2Target.singleFile
    systemProperty 'lightspeed.target.securejar3', configurations.secureJar3Target.singleFile
    systemProperty 'lightspeed.target.eventbus', configurations.eventBusTarget.singleFile
    systemProperty 'lightspeed.target.eventbus.old', configurations.eventBusOldTarget.singleFile
    systemProperty 'lightspeed.target.eventbus.mid', configurations.eventBusMidTarget.singleFile
    systemProperty 'lightspeed.target.eventbus.current', configurations.eventBusCurrentTarget.singleFile
    systemProperty 'lightspeed.target.modlauncher10', configurations.modLauncher10Target.singleFile
    systemProperty 'lightspeed.target.modlauncher11', configurations.modLauncher11Target.singleFile
    systemProperty 'lightspeed.target.modlauncher11.legacy', configurations.modLauncher11LegacyTarget.singleFile
    systemProperty 'lightspeed.agent.jar', tasks.named('shadowJar').get().archiveFile.get().asFile
}

tasks.register('smokeAgent', JavaExec) {
    group = 'verification'
    description = 'Loads the packaged agent through a real Java 17 -javaagent launch.'
    dependsOn tasks.named('testClasses'), tasks.named('shadowJar')
    classpath = sourceSets.test.output
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    jvmArgs "-javaagent:${tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath}"
    systemProperty 'lightspeed.agent.allowUnowned', 'true'
    mainClass = 'com.ccr4ft3r.lightspeed.bootstrap.AgentSmokeTarget'
}

tasks.register('verifyModuleCache', JavaExec) {
    group = 'verification'
    description = 'Verifies cold and warm module-resolution plan behavior.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    mainClass = 'com.ccr4ft3r.lightspeed.bootstrap.ModuleResolutionCacheCheck'
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyAgent'), tasks.named('smokeAgent'), tasks.named('verifyModuleCache')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
